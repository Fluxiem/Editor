    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo-Variable.ttf") format("truetype");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: block;
      }
      :root {
        --ovs-accent: #FFD400;
        --ovs-accent-ink: #000000;
        --ovs-font-caption: "Inter", "Arial Black", sans-serif;
        --ovs-font-heading: "Archivo", "Arial Black", sans-serif;
        --ovs-heading-stretch: 125%;
        --font-display: var(--ovs-font-caption);
        --font-body: var(--ovs-font-caption);
        --font-mono: var(--ovs-font-caption);
        --accent: var(--ovs-accent);
        --hw-font-print: var(--ovs-font-caption);
        --hw-ink-accent: var(--ovs-accent);
      }
      .hl-key { -webkit-text-stroke: 0; text-shadow: none; }
      .hl-key .hl-word-text { color: var(--ovs-accent-ink); }
    </style>

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      #highlight {
        pointer-events: none;
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #hl-video {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hl-overlay {
        position: absolute;
        inset: 0;
        background: transparent;
        z-index: 1;
        pointer-events: none;
      }
      #hl-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      .hl-group {
        position: absolute;
        top: 1130px;
        height: 120px;
        left: 0;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 120px;
        opacity: 0;
        visibility: hidden;
      }
      .hl-word {
        font-family: var(--ovs-font-caption);
        font-weight: 900;
        font-size: 77px;
        text-transform: uppercase;
        color: #FFFFFF;
        display: inline-block;
        letter-spacing: 0.02em;
        line-height: 1;
        position: relative;
        padding: 6px 12px 8px;
        -webkit-text-stroke: 3.0px rgba(0,0,0,0.85);
        paint-order: stroke fill;
        text-shadow: 0 4px 18px rgba(0,0,0,0.45);
        transform-origin: 50% 58%;
        will-change: transform;
      }
      .hl-word-bg {
        position: absolute;
        inset: 0;
        background: var(--ovs-accent);
        border-radius: 10px;
        box-shadow: none;
        opacity: 0;
        transform: scaleX(0);
        transform-origin: 0% 50%;
        z-index: -1;
      }
      .hl-word-text {
        position: relative;
        z-index: 1;
      }
    </style>
