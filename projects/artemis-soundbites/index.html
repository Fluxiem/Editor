      :root { --accent: #FFD400; --accent-ink: #000000; }

      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }

      #hook { position: absolute; left: 120px; right: 120px; top: 1010px; height: 300px; display: flex; align-items: center; justify-content: center; z-index: 12; }
      .hf-catalog-focus-blur-resolve { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; max-width: 840px; text-align: center; color: #fff; font: 900 92px/1.02 "Inter", sans-serif; letter-spacing: -0.02em; transform-origin: 50% 50%; -webkit-text-stroke: 3px rgba(0,0,0,0.85); paint-order: stroke fill; text-shadow: 0 4px 18px rgba(0,0,0,0.45); }
      .hf-catalog-focus-blur-resolve span { display: inline-block; filter: blur(calc(var(--hf-word-blur, 0px))); }
      .hf-catalog-focus-blur-resolve span.key { background: var(--accent); color: var(--accent-ink); -webkit-text-stroke: 0; text-shadow: none; border-radius: 10px; padding: 0 14px; }
    </style>
