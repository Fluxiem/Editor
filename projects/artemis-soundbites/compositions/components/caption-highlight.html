<!doctype html>
<html lang="en">
  <head>
    <!-- ovs-house-style -->
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo-Variable.ttf") format("truetype");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: block;
      }
      :root {
        --ovs-accent: #FFD400;
        --ovs-accent-ink: #000000;
        --ovs-font-caption: "Inter", "Arial Black", sans-serif;
        --ovs-font-heading: "Archivo", "Arial Black", sans-serif;
        --ovs-heading-stretch: 125%;
        --font-display: var(--ovs-font-caption);
        --font-body: var(--ovs-font-caption);
        --font-mono: var(--ovs-font-caption);
        --accent: var(--ovs-accent);
        --hw-font-print: var(--ovs-font-caption);
        --hw-ink-accent: var(--ovs-accent);
      }
      .hl-key { -webkit-text-stroke: 0; text-shadow: none; }
      .hl-key .hl-word-text { color: var(--ovs-accent-ink); }
    </style>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Highlight</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      #highlight {
        pointer-events: none;
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #hl-video {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hl-overlay {
        position: absolute;
        inset: 0;
        background: transparent;
        z-index: 1;
        pointer-events: none;
      }
      #hl-container {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      .hl-group {
        position: absolute;
        top: 1130px;
        height: 120px;
        left: 0;
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 120px;
        opacity: 0;
        visibility: hidden;
      }
      .hl-word {
        font-family: var(--ovs-font-caption);
        font-weight: 900;
        font-size: 76px;
        text-transform: uppercase;
        color: #ffffff;
        display: inline-block;
        letter-spacing: 0.02em;
        line-height: 1;
        position: relative;
        padding: 6px 12px 8px;
        -webkit-text-stroke: 3px rgba(0,0,0,0.85);
        paint-order: stroke fill;
        text-shadow: 0 4px 18px rgba(0,0,0,0.45);
        transform-origin: 50% 58%;
        will-change: transform, filter;
      }
      .hl-word-bg {
        position: absolute;
        inset: 0;
        background: var(--ovs-accent);
        border-radius: 10px;
        box-shadow: none;
        opacity: 0;
        transform: scaleX(0);
        transform-origin: 0% 50%;
        z-index: -1;
      }
      .hl-word-text {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="highlight"
      data-composition-id="caption-highlight"
      data-timeline-locked
      data-start="0"
      data-duration="27.81"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <div class="hl-overlay"></div>
      <div id="hl-container"></div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var _fitCanvas = document.createElement("canvas");
        var _fitCtx = _fitCanvas.getContext("2d");
        function fitFontSize(text, baseFontSize, fontWeight, fontFamily, maxWidth) {
          var size = baseFontSize;
          var minSize = Math.floor(baseFontSize * 0.45);
          while (size > minSize) {
            _fitCtx.font = fontWeight + " " + size + "px " + fontFamily;
            if (_fitCtx.measureText(text).width <= maxWidth) return size;
            size -= 2;
          }
          return minSize;
        }

        var WORDS = [
          {"text": "almost", "start": 1.92, "end": 2.64},
          {"text": "permanent", "start": 2.64, "end": 3.4},
          {"text": "sunlight", "start": 3.4, "end": 3.84, "key": true},
          {"text": "on", "start": 3.84, "end": 4.04},
          {"text": "the", "start": 4.04, "end": 4.18},
          {"text": "south", "start": 4.18, "end": 4.34},
          {"text": "pole", "start": 4.34, "end": 4.52},
          {"text": "of", "start": 4.52, "end": 4.68},
          {"text": "the", "start": 4.68, "end": 4.72},
          {"text": "moon,", "start": 4.72, "end": 4.9},
          {"text": "that's", "start": 5.06, "end": 5.34},
          {"text": "power.", "start": 5.34, "end": 5.7, "key": true},
          {"text": "on", "start": 5.86, "end": 6.08},
          {"text": "the", "start": 6.08, "end": 6.22},
          {"text": "south", "start": 6.22, "end": 6.4},
          {"text": "pole", "start": 6.4, "end": 6.62},
          {"text": "of", "start": 6.62, "end": 6.78},
          {"text": "the", "start": 6.78, "end": 6.86},
          {"text": "moon", "start": 6.86, "end": 7.14},
          {"text": "is", "start": 7.14, "end": 7.8},
          {"text": "where", "start": 7.8, "end": 8.12},
          {"text": "water", "start": 8.12, "end": 8.52},
          {"text": "ice", "start": 8.52, "end": 8.82, "key": true},
          {"text": "resides", "start": 8.82, "end": 9.32},
          {"text": "in", "start": 9.32, "end": 9.64},
          {"text": "mass", "start": 9.64, "end": 9.9},
          {"text": "volumes.", "start": 9.9, "end": 10.52},
          {"text": "Water", "start": 10.68, "end": 11.26},
          {"text": "ice,", "start": 11.26, "end": 11.56, "key": true},
          {"text": "is", "start": 11.72, "end": 12.0},
          {"text": "life", "start": 12.0, "end": 12.2},
          {"text": "support.", "start": 12.2, "end": 12.62, "key": true},
          {"text": "It's", "start": 12.78, "end": 13.03},
          {"text": "water", "start": 13.03, "end": 13.29},
          {"text": "to", "start": 13.29, "end": 13.55},
          {"text": "drink,", "start": 13.55, "end": 13.85},
          {"text": "it's", "start": 14.01, "end": 14.11},

          {"text": "to", "start": 14.29, "end": 14.45},
          {"text": "breathe,", "start": 14.45, "end": 14.73},
          {"text": "but", "start": 14.89, "end": 15.07},
          {"text": "it's", "start": 15.07, "end": 15.25},

          {"text": "rocket", "start": 15.51, "end": 15.89},
          {"text": "fuel.", "start": 15.89, "end": 16.15, "key": true},

          {"text": "same", "start": 16.53, "end": 16.73},
          {"text": "rocket", "start": 16.73, "end": 17.05},
          {"text": "fuel", "start": 17.05, "end": 17.27, "key": true},
          {"text": "that", "start": 17.27, "end": 17.45},
          {"text": "will", "start": 17.45, "end": 17.63},
          {"text": "power", "start": 17.63, "end": 18.05, "key": true},
          {"text": "the", "start": 18.05, "end": 18.73},
          {"text": "space", "start": 18.73, "end": 18.99},
          {"text": "launch", "start": 18.99, "end": 19.27},

          {"text": "So", "start": 22.63, "end": 23.07},

          {"text": "that's", "start": 26.97, "end": 27.33},
          {"text": "the", "start": 27.33, "end": 27.47},
          {"text": "goal.", "start": 27.47, "end": 27.71, "key": true}
        ];

        var RAW_GROUPS = [[0, 2], [3, 5], [6, 8], [9, 9], [10, 11], [12, 14], [15, 17], [18, 20], [21, 23], [24, 26], [27, 28], [29, 31], [32, 34], [35, 35], [36, 38], [39, 39], [40, 42], [43, 44], [45, 47], [48, 50], [51, 53], [54, 56], [57, 58], [59, 61], [62, 63], [64, 66], [67, 69], [70, 70], [71, 73], [74, 74], [75, 75], [76, 77], [78, 80]];
        var GROUPS = RAW_GROUPS.map(function (pair, gi) {
          var ws = pair[0],
            we = pair[1];
          var nextStart = gi + 1 < RAW_GROUPS.length ? WORDS[RAW_GROUPS[gi + 1][0]].start : 27.81;
          var gEnd = Math.min(WORDS[we].end + 0.5, nextStart - 0.05);
          return { wordStart: ws, wordEnd: we, start: WORDS[ws].start, end: gEnd };
        });

        var container = document.getElementById("hl-container");
        var tl = gsap.timeline({ paused: true });

        GROUPS.forEach(function (g, gi) {
          var groupWords = WORDS.slice(g.wordStart, g.wordEnd + 1);
          var grp = document.createElement("div");
          grp.className = "hl-group";
          grp.id = "hl-grp-" + gi;

          var groupText = groupWords
            .map(function (w) {
              return w.text.toUpperCase();
            })
            .join(" ");
          var computedSize = fitFontSize(groupText, 76, "900", "Inter", 840);

          groupWords.forEach(function (w, i) {
            var wi = g.wordStart + i;
            var wordEl = document.createElement("span");
            wordEl.className = "hl-word";
            wordEl.id = "hl-w-" + wi;
            if (w.key) wordEl.className += " hl-key";
            wordEl.style.fontSize = computedSize + "px";

            var bgEl = document.createElement("span");
            bgEl.className = "hl-word-bg";
            bgEl.id = "hl-bg-" + wi;

            var textEl = document.createElement("span");
            textEl.className = "hl-word-text";
            textEl.textContent = w.text.toUpperCase();

            wordEl.appendChild(bgEl);
            wordEl.appendChild(textEl);
            grp.appendChild(wordEl);
          });

          container.appendChild(grp);

          tl.set(grp, { visibility: "visible" }, g.start);
          tl.fromTo(
            grp,
            { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.14, ease: "back.out(2)" },
            g.start,
          );

          groupWords.forEach(function (w, i) {
            var wi = g.wordStart + i;
            var bgEl = document.getElementById("hl-bg-" + wi);
            var wordEl = document.getElementById("hl-w-" + wi);

            if (w.key) tl.set(bgEl, { opacity: 1, scaleX: 1 }, g.start);
            tl.to(
              wordEl,
              { filter: "brightness(1.05)", duration: 0.08, ease: "power2.out" },
              w.start,
            );
            tl.to(
              wordEl,
              { filter: "brightness(1)", duration: 0.16, ease: "power2.out" },
              w.start + 0.08,
            );
            
          });

          tl.to(grp, { opacity: 0, duration: 0.1, ease: "power2.in" }, g.end - 0.1);
          tl.set(grp, { opacity: 0, visibility: "hidden" }, g.end);
        });

        tl.seek(0);
        window.__timelines["caption-highlight"] = tl;
      })();
    </script>
  </body>
</html>
